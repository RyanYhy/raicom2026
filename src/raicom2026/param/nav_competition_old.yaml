# ---- 时序/超时 (秒) ----
person_timeout_s: 35      # 人物: 单位置扫描5帧~3s + 3敌军打靶~24s
mine_timeout_s: 12        # 雷区采样 5s + 余量
nav_timeout_s: 45         # 每段导航最长时间
nav_retry: 1              # 每段导航失败重试次数
map_wait_s: 15            # 等 /map 上限
global_budget_s: 600      # 全场硬预算

# ---- 四区反坦克兜底 ----
iv_lateral_offset_m: 0.35 # 横向绕行偏移
iv_stall_wait_s: 3.0      # 失败后等陈旧避障云消失再试
