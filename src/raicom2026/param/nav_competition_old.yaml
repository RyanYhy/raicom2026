# ============================================================
# nav_competition.yaml —— 自主导航编排节点配置 (nav_competition.py)
# ------------------------------------------------------------
# 2026-08-17: 场地重新实测 22 个航点 (mark_waypoint_live 记录)
#   任务点: person = P3/P5(一区) + P18/P19(三区)
#           mine   = P10(二区) + P20(三区)
#           antitank = P21(四区)
# ============================================================

# AMCL 初始位姿 (map 系)。起点在 (0, 0) 附近 (map 原点=建图起点)。
# (Cartographer 模式用 launch 的 initial_x/y/yaw_deg, 这里保持 AMCL 兼容)
amcl_initial_pose:
  x: -0.135
  y: -0.103
  yaw_deg: -0.44

course:
  - name: P1
    x: 3.0151    # 2.892
    y: -0.1237    #0.021
    yaw_deg: 84.46
    tasks: []

  - name: P2
    x: 3.0786
    y: 0.419
    yaw_deg: 178.46
    tasks: []

  - name: P3          # 一区 识别打靶点 A (人偶在右侧)
    zone: 一区
    x: 2.3926
    y: 0.4282
    yaw_deg: 143.68
    gimbal_bias: -60.0
    tasks:
      - { type: person, zone: A }

  - name: P4
    x: 2.3915
    y: 0.4104
    yaw_deg: -176.09
    tasks: []

