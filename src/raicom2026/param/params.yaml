# ============================================================
# raicom2026 云台标定参数 (webcam_person_gun.py 启动时读取)
# ------------------------------------------------------------
# 用 scripts/calibrate.py 的 ppd 子命令标定 px→度 后把数值填这里。
# 节点读取的键: ppd_h ppd_v s_h s_v t0 tilt_step
#               tilt_offset_a0 tilt_offset_a1 target_h_m focal_px
#
# ⚠️ 开火前必须标定 (未标定默认值会系统性脱靶/无法居中):
#   - ppd_h/ppd_v: px/度 (标定决定)
#   - s_h / s_v  : 方向符号因子 (+pan/+tilt 目标往图像哪边移)。
#                  尤其 s_v 决定"云台仰/俯"的像素方向:
#                    * 若调高 tilt 指令角度时, 目标在画面中向下移动 (v 增大)
#                      -> s_v = -1
#                    * 若目标向上移动 (v 减小) -> s_v = +1
#                  标定步骤: 对准一个人物 -> /gun/aim 把 tilt 从 90 调到 100
#                  -> 看目标像素 v 是变大还是变小, 依上式填 s_v。
#                  填反了: 闭环微调会发散, 永远 FIRE 不了 (安全但不射中)。
#   - tilt_offset_a0/a1: 弹道垂直补偿 TILT_OFFSET(d)=a0+a1/d, 0.8/1.5/2.0m 实测
# ============================================================
ppd_h: 10.36  # 真实世界标定: 人偶间距10cm@0.6m, 像素98px (2026-08-12)
ppd_v: 10.55  # 640x480 实测标定 (2026-08-12)
s_h: -1.0   # 640x480 实测反推 (2026-08-12): pan+10 -> 目标u减小, 取-1
s_v: -1                 # 垂直方向符号因子 ⚠️ 默认 -1 (调高 tilt 角->目标下移);
                        # 标定后若实测方向相反改成 +1
calibrated: true    # 2026-08-12 已实测标定并验证命中: ppd_h=10.36 ppd_v=10.55 s_h=-1 s_v=-1 pan_offset=-5.7 tilt_a0=-2
                        # 否则 webcam_person_gun 禁止开火(仅计数), 防止脱靶/误指友军
t0: 80.0                # 各区俯仰基准 (方案建议 78-82)
tilt_step: 10.0         # 两档俯仰差
tilt_offset_a0: -2.0   # 枪口偏高迭代修正(第1轮: -2°)
tilt_offset_a1: 0.0     # 弹道垂直补偿 a1 (度*m, tilt_offset=a0+a1/距离)
target_h_m: 0.30        # 目标贴纸物理高度(m), 框高反推距离用
focal_px: 610.0         # orbbec 焦距(px), 反坦克盘测距用
pan_offset_deg: -5.7   # 枪管偏左5cm@0.5m=5.7°, 补偿右转 (2026-08-12)
